spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/special_ed_assistant?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:special_ed_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ===== AI 配置 =====
ai:
  base-url: ${AI_BASE_URL:https://api.anthropic.com/v1/messages}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:claude-sonnet-5}
  max-tokens: ${AI_MAX_TOKENS:2048}
