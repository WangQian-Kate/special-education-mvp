openapi: 3.0.3
info:
  title: 特殊教育课堂助手 API
  version: 0.7.0
  description: |
    根据 V2 软件原型重写的接口契约，按“随班记录、训练计划、学生评估、我的、系统”五个页面模块组织。
    当前采用白名单伪登录，业务接口使用 X-Teacher-Id: t001/t002/t003 确定当前教师；不接收 X-User-Id。
    所有响应统一使用 { code, message, data } 包体；code 为 0 表示成功。
    AI 分析、学期报告、导出分享、学生管理、个人资料修改和退出登录暂不包含。
servers:
  - url: http://localhost:3000/api
    description: 本地开发环境
security: []
tags:
  - name: 系统
    description: 服务状态
  - name: 我的
    description: 当前用户、绑定学生和当前学生选择
  - name: 随班记录
    description: 课堂信息、行为卡片、快速记录、补记和详细记录
  - name: 学生评估
    description: 基于随班记录的日报、周报和月报概况、行为频次及环比趋势
  - name: 训练计划
    description: 165 项标准目标库、学生目标分配、自定义目标和即时更新

paths:
  /health:
    get:
      tags: [系统]
      operationId: health
      summary: 服务健康检查
      description: 正式替代 Day3 任务草案中的 GET /api/test，供前端“测试后端连接”和首次联合联调使用。
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
              example:
                code: 0
                message: ok
                data:
                  status: UP

  /me:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [我的]
      operationId: getMyProfile
      summary: 查询当前用户和当前学生
      description: |
        返回个人中心顶部信息。绑定多个学生但尚未选择时，currentStudent 为 null，
        requiresStudentSelection 为 true。只绑定一个学生时，后端可以自动设为当前学生。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileApiResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/students:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [我的]
      operationId: listMyStudents
      summary: 查询当前用户绑定的学生
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryListApiResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/current-student:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    put:
      tags: [我的]
      operationId: updateCurrentStudent
      summary: 切换并保存当前学生
      description: 所选学生必须已经与当前用户绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentStudentRequest'
            example:
              studentId: 1
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [随班记录]
      operationId: listClassRecords
      summary: 查询指定日期的课堂记录
      description: 相同日期、课程和环境允许返回多条独立课堂记录。
      parameters:
        - $ref: '#/components/parameters/RecordDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordSummaryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [随班记录]
      operationId: createClassRecord
      summary: 新建一次独立课堂记录
      description: 当前学生由后端保存的用户上下文确定，不在请求体中发送 studentId 或 creatorId。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRecordRequest'
            example:
              recordDate: '2026-07-17'
              courseCode: CHINESE
              environmentCode: CLASSROOM
              observationDurationMinutes: 15
              overallRemark: 今天精神状态较差。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/behavior-options:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [随班记录]
      operationId: listBehaviorOptions
      summary: 查询课程对应的行为卡片
      parameters:
        - $ref: '#/components/parameters/CourseCode'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeLabelListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/summary:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [随班记录]
      operationId: getClassRecordSummary
      summary: 查询周记录或月记录只读汇总
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ClassRecordSummaryPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCountStatisticsApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/ClassRecordId'
    get:
      tags: [随班记录]
      operationId: getClassRecord
      summary: 查询课堂信息和行为卡片次数
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [随班记录]
      operationId: updateClassRecord
      summary: 自动保存课堂信息和整体备注
      description: 前端输入停止后防抖调用。未出现的字段保持原值，显式 null 清空允许为空的字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRecordRequest'
            example:
              overallRemark: 下午注意力下降。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records/quick:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/ClassRecordId'
    post:
      tags: [随班记录]
      operationId: createQuickBehaviorRecord
      summary: 快速新增一次行为
      description: 发生时间由后端按上海时区生成，一次请求只新增一条记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuickBehaviorRequest'
            example:
              behaviorCode: LEAVE_SEAT
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCardMutationResultApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records/supplement:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/ClassRecordId'
    post:
      tags: [随班记录]
      operationId: createSupplementBehaviorRecord
      summary: 补记过去发生的一次行为
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplementBehaviorRequest'
            example:
              behaviorCode: LEAVE_SEAT
              occurredAt: '2026-07-17T09:12:45+08:00'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCardMutationResultApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/ClassRecordId'
    get:
      tags: [随班记录]
      operationId: listBehaviorRecordTimes
      summary: 查询某行为的发生时间列表
      parameters:
        - $ref: '#/components/parameters/BehaviorCode'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 按发生时间升序返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /behavior-records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/BehaviorRecordId'
    get:
      tags: [随班记录]
      operationId: getBehaviorRecord
      summary: 查询一条详细记录
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [随班记录]
      operationId: deleteBehaviorRecord
      summary: 删除一条行为记录
      description: 前端根据记录的 detailSaved 决定是否先显示确认框。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /behavior-records/{recordId}/details:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/BehaviorRecordId'
    put:
      tags: [随班记录]
      operationId: saveBehaviorRecordDetails
      summary: 保存完整详细记录
      description: |
        每次保存按请求整体覆盖详细字段，并把 detailSaved 永久设为 true。
        已经为 true 的记录即使清空全部可空字段也不会恢复为 false。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBehaviorDetailsRequest'
            example:
              durationMinutes: 1
              antecedentText: 教师开始点名。
              behaviorDescription: 学生离开座位走向门口。
              consequenceText: 教师口头提示后返回。
              assistances:
                - code: VERBAL_PROMPT
                  content: 提示学生回到座位。
              assistanceResultText: 一次语言提示后返回座位。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /student-evaluation/statistics:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [学生评估]
      operationId: getStudentEvaluationStatistics
      summary: 查询日报、周报或月报概况及行为趋势
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EvaluationPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEvaluationStatisticsApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/categories:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [训练计划]
      operationId: listTrainingGoalCategories
      summary: 查询训练目标分类
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGoalCategoryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/library:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [训练计划]
      operationId: listTrainingGoalLibrary
      summary: 搜索和筛选标准目标库
      parameters:
        - name: keyword
          in: query
          required: false
          description: 暂时只对训练目标名称进行模糊匹配
          schema:
            type: string
            maxLength: 100
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGoalLibraryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    get:
      tags: [训练计划]
      operationId: listTrainingPlanItems
      summary: 查询当前学生已分配目标
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainingStatus'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/standard:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    post:
      tags: [训练计划]
      operationId: assignStandardTrainingGoals
      summary: 为当前学生激活标准目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStandardGoalsRequest'
            example:
              assignments:
                - goalId: 101
                  initialLevel: C
                - goalId: 102
                  initialLevel: D
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '201':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/custom:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
    post:
      tags: [训练计划]
      operationId: createCustomTrainingGoal
      summary: 创建并分配自定义目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomGoalRequest'
            example:
              goalText: 在集体课开始前独立准备好教材。
              initialLevel: C
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TeacherIdHeader'
      - $ref: '#/components/parameters/TrainingPlanItemId'
    patch:
      tags: [训练计划]
      operationId: updateTrainingPlanItem
      summary: 即时更新当前等级、阶段或状态
      description: 学期初等级不允许修改。前端每次下拉变化后立即调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingPlanItemRequest'
            example:
              currentLevel: D
              phase: 2
              status: IN_PROGRESS
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [训练计划]
      operationId: deleteTrainingPlanItem
      summary: 取消标准目标分配或删除自定义目标
      parameters:
        - name: confirmed
          in: query
          required: false
          description: 已产生进度时，前端二次确认后传 true
          schema:
            type: boolean
            default: false
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedTeacher'
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConfirmationRequired'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TeacherIdHeader:
      name: X-Teacher-Id
      in: header
      required: true
      description: 白名单教师 ID；当前仅允许 t001、t002、t003
      schema:
        type: string
        enum: [t001, t002, t003]
      example: t001
    RecordDate:
      name: recordDate
      in: query
      required: true
      description: 查询的自然日
      schema:
        type: string
        format: date
    ReferenceDate:
      name: referenceDate
      in: query
      required: true
      description: 用于计算自然日、自然周或自然月的参考日期
      schema:
        type: string
        format: date
    ClassRecordId:
      name: classRecordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BehaviorRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TrainingPlanItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CourseCode:
      name: courseCode
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    BehaviorCode:
      name: behaviorCode
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

