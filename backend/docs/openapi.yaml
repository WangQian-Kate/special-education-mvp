openapi: 3.0.3
info:
  title: 特殊教育课堂助手 API
  version: 0.14.0
  description: |
    根据软件原型维护的接口契约，按“登录认证、随班记录、训练计划、学生评估、我的、系统”六个模块组织。
    正式接口使用微信 code2Session 登录和 Bearer 会话令牌；X-Teacher-Id 仅保留在 dev/test 环境。
    所有响应统一使用 { code, message, data } 包体；code 为 0 表示成功。
    AppSecret、OpenID、微信临时 code 和原始 token 均不得写入前端、文档或日志。
servers:
  - url: http://localhost:3000/api
    description: 本地开发环境
security:
  - bearerAuth: []
tags:
  - name: 系统
    description: 服务状态
  - name: 登录认证
    description: 微信登录、教师首次绑定和退出登录
  - name: 我的
    description: 当前用户、绑定学生和当前学生选择
  - name: 随班记录
    description: 课堂信息、行为卡片、快速记录、补记和详细记录
  - name: 学生评估
    description: 基于随班记录的日报、周报和月报概况、行为频次及环比趋势
  - name: 训练计划
    description: 165 项标准目标库、学生目标分配、自定义目标和即时更新

paths:
  /health:
    get:
      tags: [系统]
      security: []
      operationId: health
      summary: 服务健康检查
      description: 正式替代 Day3 任务草案中的 GET /api/test，供前端“测试后端连接”和首次联合联调使用。
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
              example:
                code: 0
                message: ok
                data:
                  status: UP

  /auth/wechat/login:
    post:
      tags: [登录认证]
      security: []
      operationId: wechatLogin
      summary: 微信登录
      description: |
        前端通过 wx.login 获取一次性 code 后提交。已绑定微信直接登录；
        首次登录必须同时提交由后端工具生成的一次性教师绑定码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
            example:
              code: 微信临时登录凭证
              bindingCode: ABCD-EFGH
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatLoginApiResponse'
        '400':
          $ref: '#/components/responses/WechatLoginValidationError'
        '403':
          $ref: '#/components/responses/WechatBindingRequired'
        '409':
          $ref: '#/components/responses/WechatBindingConflict'
        '502':
          $ref: '#/components/responses/WechatUpstreamError'
        '503':
          $ref: '#/components/responses/WechatNotConfigured'

  /auth/logout:
    post:
      tags: [登录认证]
      operationId: logout
      summary: 退出当前设备
      description: 注销当前 Bearer 会话；成功后前端删除本地 accessToken。
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'

  /me:
    get:
      tags: [我的]
      operationId: getMyProfile
      summary: 查询当前用户和当前学生
      description: |
        返回个人中心顶部信息。绑定多个学生但尚未选择时，currentStudent 为 null，
        requiresStudentSelection 为 true。只绑定一个学生时，后端可以自动设为当前学生。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileApiResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/students:
    get:
      tags: [我的]
      operationId: listMyStudents
      summary: 查询当前用户绑定的学生
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryListApiResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/current-student:
    put:
      tags: [我的]
      operationId: updateCurrentStudent
      summary: 切换并保存当前学生
      description: 所选学生必须已经与当前用户绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentStudentRequest'
            example:
              studentId: 1
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records:
    get:
      tags: [随班记录]
      operationId: listClassRecords
      summary: 查询指定日期的课堂记录
      description: 相同日期、课程和环境允许返回多条独立课堂记录。
      parameters:
        - $ref: '#/components/parameters/RecordDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordSummaryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [随班记录]
      operationId: createClassRecord
      summary: 新建一次独立课堂记录
      description: 当前学生由后端保存的用户上下文确定，不在请求体中发送 studentId 或 creatorId。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRecordRequest'
            example:
              recordDate: '2026-07-17'
              courseCode: CHINESE
              environmentCode: CLASSROOM
              observationDurationMinutes: 15
              overallRemark: 今天精神状态较差。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/behavior-options:
    get:
      tags: [随班记录]
      operationId: listBehaviorOptions
      summary: 查询课程和环境对应的标准行为目录
      parameters:
        - $ref: '#/components/parameters/CourseCode'
        - $ref: '#/components/parameters/OptionalEnvironmentCode'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCatalogListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/abc-tags:
    get:
      tags: [随班记录]
      operationId: listAbcQuickTags
      summary: 查询 ABC 前因和后果快捷标签字典
      description: |
        返回 A（行为前因）和 C（行为后果）的分组快捷标签，均按 displayOrder 升序排列。
        前端应按分组渲染标签；requiresCustomText=true 的“其他”项选中后必须填写自定义内容。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbcTagDictionaryApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/summary:
    get:
      tags: [随班记录]
      operationId: getClassRecordSummary
      summary: 查询周记录或月记录只读汇总
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ClassRecordSummaryPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCountStatisticsApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}:
    parameters:
      - $ref: '#/components/parameters/ClassRecordId'
    get:
      tags: [随班记录]
      operationId: getClassRecord
      summary: 查询课堂信息和行为卡片次数
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [随班记录]
      operationId: updateClassRecord
      summary: 自动保存课堂信息和整体备注
      description: 前端输入停止后防抖调用。未出现的字段保持原值，显式 null 清空允许为空的字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRecordRequest'
            example:
              overallRemark: 下午注意力下降。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records/quick:
    parameters:
      - $ref: '#/components/parameters/ClassRecordId'
    post:
      tags: [随班记录]
      operationId: createQuickBehaviorRecord
      summary: 快速新增一次行为
      description: 发生时间由后端按上海时区生成，一次请求只新增一条记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuickBehaviorRequest'
            example:
              behaviorCode: B006
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCardMutationResultApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records/supplement:
    parameters:
      - $ref: '#/components/parameters/ClassRecordId'
    post:
      tags: [随班记录]
      operationId: createSupplementBehaviorRecord
      summary: 补记过去发生的一次行为
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplementBehaviorRequest'
            example:
              behaviorCode: B006
              occurredAt: '2026-07-17T09:12:45+08:00'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCardMutationResultApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /class-records/{classRecordId}/behavior-records:
    parameters:
      - $ref: '#/components/parameters/ClassRecordId'
    get:
      tags: [随班记录]
      operationId: listBehaviorRecordTimes
      summary: 查询某行为的发生时间列表
      parameters:
        - $ref: '#/components/parameters/BehaviorCode'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 按发生时间升序返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /behavior-records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/BehaviorRecordId'
    get:
      tags: [随班记录]
      operationId: getBehaviorRecord
      summary: 查询一条详细记录
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [随班记录]
      operationId: deleteBehaviorRecord
      summary: 删除一条行为记录
      description: 前端根据记录的 detailSaved 决定是否先显示确认框。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /behavior-records/{recordId}/details:
    parameters:
      - $ref: '#/components/parameters/BehaviorRecordId'
    put:
      tags: [随班记录]
      operationId: saveBehaviorRecordDetails
      summary: 保存完整详细记录
      description: |
        每次保存按请求整体覆盖详细字段。持续时间、行为环节、A/B/C 文本或快捷标签、行为功能、
        辅助方式或辅助结果至少填写一项；全部为空时返回 400。
        antecedentSelections 和 consequenceSelections 支持多选；标签编码必须来自
        GET /class-records/abc-tags。选择 OTHER 时 customText 必填，其他标签不得传 customText。
        保存成功后把 detailSaved 永久设为 true。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBehaviorDetailsRequest'
            example:
              durationMinutes: 1
              antecedentText: 教师开始点名。
              antecedentSelections:
                - code: TASK_NEW
              behaviorDescription: 学生离开座位走向门口。
              consequenceText: 教师口头提示后返回。
              consequenceSelections:
                - code: VERBAL_PROMPT
              assistances:
                - code: VERBAL_ASSISTANCE
              assistanceResultText: 一次语言提示后返回座位。
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorRecordDetailApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /student-evaluation/statistics:
    get:
      tags: [学生评估]
      operationId: getStudentEvaluationStatistics
      summary: 查询日报、周报或月报概况及行为趋势
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EvaluationPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEvaluationStatisticsApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /student-evaluation/abc-distribution:
    get:
      tags: [学生评估]
      operationId: getAbcFunctionDistribution
      summary: 查询 ABC 行为功能分布
      description: 仅统计详细记录中已选择行为功能的记录；返回全部 5 项字典，无记录项次数为 0。
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EvaluationPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbcDistributionApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /student-evaluation/behavior-description-trend:
    get:
      tags: [学生评估]
      operationId: getBehaviorDescriptionTrend
      summary: 查询行为表现自由文本频次和月度趋势
      description: 按 trim 后完全一致的 behaviorDescription 分组，仅支持 WEEKLY、MONTHLY。
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [WEEKLY, MONTHLY]
        - $ref: '#/components/parameters/ReferenceDate'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorDescriptionTrendApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /student-evaluation/daily-evaluation:
    get:
      tags: [学生评估]
      operationId: getDailyEvaluation
      summary: 查询指定日期的六维度学生评估
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 查询成功；尚未填写时六个维度返回空值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEvaluationApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [学生评估]
      operationId: saveDailyEvaluation
      summary: 保存指定日期的六维度学生评估
      description: 按当前教师主动选择的学生和 recordDate 幂等新增或覆盖；六个维度均可为空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyEvaluation'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/categories:
    get:
      tags: [训练计划]
      operationId: listTrainingGoalCategories
      summary: 查询训练目标分类
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGoalCategoryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/library:
    get:
      tags: [训练计划]
      operationId: listTrainingGoalLibrary
      summary: 搜索和筛选标准目标库
      parameters:
        - name: keyword
          in: query
          required: false
          description: 暂时只对训练目标名称进行模糊匹配
          schema:
            type: string
            maxLength: 100
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGoalLibraryListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/goals-progress:
    get:
      tags: [训练计划]
      operationId: getTrainingGoalsProgress
      summary: 查询当前学生全部已激活目标的周期进度
      description: 无记录的已激活目标仍返回且次数为 0；自定义目标因无标准行为映射，当前次数为 0。
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProgressPeriod'
        - $ref: '#/components/parameters/ReferenceDate'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsProgressApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/goals/{standardNumber}/records:
    parameters:
      - name: standardNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 165
    get:
      tags: [训练计划]
      operationId: getTrainingGoalRecords
      summary: 查询标准目标关联的最新行为记录
      description: 一条行为记录计入其主行为关联的全部训练目标，不按子行为二次过滤。
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalRecordsApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items:
    get:
      tags: [训练计划]
      operationId: listTrainingPlanItems
      summary: 查询当前学生已分配目标
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainingStatus'
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/standard:
    post:
      tags: [训练计划]
      operationId: assignStandardTrainingGoals
      summary: 为当前学生激活标准目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignStandardGoalsRequest'
            example:
              assignments:
                - goalId: 101
                  initialLevel: C
                - goalId: 102
                  initialLevel: D
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '201':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemListApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/custom:
    post:
      tags: [训练计划]
      operationId: createCustomTrainingGoal
      summary: 创建并分配自定义目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomGoalRequest'
            example:
              goalText: 在集体课开始前独立准备好教材。
              initialLevel: C
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /training-plan/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TrainingPlanItemId'
    patch:
      tags: [训练计划]
      operationId: updateTrainingPlanItem
      summary: 即时更新当前等级、阶段或状态
      description: 学期初等级不允许修改。前端每次下拉变化后立即调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingPlanItemRequest'
            example:
              currentLevel: D
              phase: 2
              status: IN_PROGRESS
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItemApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [训练计划]
      operationId: deleteTrainingPlanItem
      summary: 取消标准目标分配或删除自定义目标
      parameters:
        - name: confirmed
          in: query
          required: false
          description: 已产生进度时，前端二次确认后传 true
          schema:
            type: boolean
            default: false
      responses:
        '401':
          $ref: '#/components/responses/UnauthorizedSession'
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BusinessValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConfirmationRequired'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: POST /auth/wechat/login 返回的随机会话令牌

  parameters:
    RecordDate:
      name: recordDate
      in: query
      required: true
      description: 查询的自然日
      schema:
        type: string
        format: date
    ReferenceDate:
      name: referenceDate
      in: query
      required: true
      description: 用于计算自然日、自然周或自然月的参考日期
      schema:
        type: string
        format: date
    ClassRecordId:
      name: classRecordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BehaviorRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TrainingPlanItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CourseCode:
      name: courseCode
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/CourseCodeValue'
    OptionalEnvironmentCode:
      name: environmentCode
      in: query
      required: false
      description: 可选；提供后只返回同时推荐给该环境的行为。
      schema:
        $ref: '#/components/schemas/EnvironmentCodeValue'
    BehaviorCode:
      name: behaviorCode
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

  schemas:
    CourseCodeValue:
      type: string
      enum:
        - CHINESE
        - MATHEMATICS
        - ENGLISH
        - PHYSICAL_EDUCATION
        - MUSIC
        - ART
        - SCIENCE
        - MORAL_EDUCATION
        - PHYSICAL_TRAINING
        - INDIVIDUAL_TRAINING
        - BREAK
        - LUNCH
        - NOON_REST
        - SELF_STUDY
        - OTHER
        - ALL_DAY_SUMMARY

    EnvironmentCodeValue:
      type: string
      enum:
        - CLASSROOM
        - RESOURCE_CLASSROOM
        - PLAYGROUND
        - CORRIDOR
        - RESTROOM
        - OFF_CAMPUS
        - OTHER

    SuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          enum: [ok]

    HealthApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthResponse'

    WechatLoginApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WechatLoginResponse'

    MyProfileApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MyProfile'

    StudentSummaryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentSummary'

    StudentSummaryApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudentSummary'

    ClassRecordSummaryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ClassRecordSummary'

    ClassRecordDetailApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ClassRecordDetail'

    BehaviorCatalogListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BehaviorCatalogItem'

    AbcTagDictionaryApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AbcTagDictionary'

    BehaviorCountStatisticsApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BehaviorCountStatistics'

    StudentEvaluationStatisticsApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudentEvaluationStatistics'

    AbcDistributionApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AbcDistribution'

    BehaviorDescriptionTrendApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BehaviorDescriptionTrend'

    DailyEvaluationApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DailyEvaluation'

    BehaviorCardMutationResultApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BehaviorCardMutationResult'

    BehaviorRecordListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BehaviorRecordListItem'

    BehaviorRecordDetailApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BehaviorRecordDetail'

    TrainingGoalCategoryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingGoalCategory'

    TrainingGoalLibraryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingGoalLibraryItem'

    TrainingPlanItemListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingPlanItem'

    TrainingPlanItemApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrainingPlanItem'

    GoalsProgressApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GoalsProgressResponse'

    GoalRecordsApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GoalRecordsResponse'

    EmptyApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]

    WechatLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: wx.login 返回的一次性临时凭证
        bindingCode:
          type: string
          maxLength: 64
          nullable: true
          description: 仅未绑定微信首次登录时填写

    WechatLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, newlyBound, profile]
      properties:
        accessToken:
          type: string
          description: 仅在本次响应中返回，后续通过 Authorization Bearer 携带
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        newlyBound:
          type: boolean
        profile:
          $ref: '#/components/schemas/MyProfile'

    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [40001, 40002, 40010, 40011, 40101, 40102, 40301, 40401, 40901, 40902, 40903, 50000, 50201, 50301]
        message:
          type: string
          minLength: 1
        data:
          type: object
          nullable: true
          example: null

    UserRole:
      type: string
      enum: [RESOURCE_TEACHER, SHADOW_TEACHER, PARENT]

    UserProfile:
      type: object
      required: [id, teacherId, name, role]
      properties:
        id:
          type: integer
          format: int64
        teacherId:
          type: string
          enum: [t001, t002, t003]
        avatar:
          type: string
          nullable: true
          maxLength: 500
        name:
          type: string
        school:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'

    StudentSummary:
      type: object
      required: [id, studentCode, name]
      properties:
        id:
          type: integer
          format: int64
        studentCode:
          type: string
          pattern: '^s[0-9]{3}$'
        name:
          type: string
        gender:
          type: string
          nullable: true
          enum: [MALE, FEMALE]
        age:
          type: integer
          nullable: true
          minimum: 0
        className:
          type: string
          nullable: true
        disabilityType:
          type: string
          nullable: true
        remark:
          type: string
          nullable: true

    MyProfile:
      type: object
      required: [user, requiresStudentSelection]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        currentStudent:
          type: object
          allOf:
            - $ref: '#/components/schemas/StudentSummary'
          nullable: true
        requiresStudentSelection:
          type: boolean

    UpdateCurrentStudentRequest:
      type: object
      required: [studentId]
      properties:
        studentId:
          type: integer
          format: int64
          minimum: 1

    BehaviorGroupStatusSummary:
      type: object
      required: [code, label, displayOrder]
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer

    BehaviorGroupSummary:
      type: object
      required: [code, label, displayOrder, itemDisplayOrder, statusOptions]
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer
        itemDisplayOrder:
          type: integer
        statusOptions:
          type: array
          description: 分组状态栏；无状态栏的普通分组返回空数组。
          items:
            $ref: '#/components/schemas/BehaviorGroupStatusSummary'

    PerformanceOptionSummary:
      type: object
      required: [code, label, requiresCustomText]
      properties:
        code:
          type: string
        label:
          type: string
        requiresCustomText:
          type: boolean

    SubBehaviorSummary:
      type: object
      required: [code, label, displayOrder, performanceOptions]
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer
        performanceOptions:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceOptionSummary'

    TrainingGoalReference:
      type: object
      required: [standardNumber, goalText]
      properties:
        standardNumber:
          type: integer
          minimum: 11
          maximum: 165
        goalText:
          type: string
        subBehaviorCode:
          type: string
          nullable: true

    BehaviorCatalogItem:
      type: object
      required:
        - code
        - label
        - moduleCode
        - moduleLabel
        - moduleDisplayOrder
        - displayOrder
        - groups
        - recommendedCourseCodes
        - recommendedEnvironmentCodes
        - trainingGoals
        - subBehaviors
        - performanceOptions
      properties:
        code:
          type: string
          pattern: '^B\d{3}$'
        label:
          type: string
        moduleCode:
          type: string
        moduleLabel:
          type: string
        moduleDisplayOrder:
          type: integer
        displayOrder:
          type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/BehaviorGroupSummary'
        recommendedCourseCodes:
          type: array
          items:
            $ref: '#/components/schemas/CourseCodeValue'
        recommendedEnvironmentCodes:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentCodeValue'
        trainingGoals:
          type: array
          items:
            $ref: '#/components/schemas/TrainingGoalReference'
        subBehaviors:
          type: array
          items:
            $ref: '#/components/schemas/SubBehaviorSummary'
        performanceOptions:
          type: array
          description: 不隶属于子行为的主行为表现选项。
          items:
            $ref: '#/components/schemas/PerformanceOptionSummary'

    AbcTagOption:
      type: object
      required: [code, label, displayOrder, requiresCustomText]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
        displayOrder:
          type: integer
          minimum: 1
        requiresCustomText:
          type: boolean

    AbcTagGroup:
      type: object
      required: [code, label, displayOrder, options]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
        displayOrder:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/AbcTagOption'

    AbcTagDictionary:
      type: object
      required: [antecedentGroups, consequenceGroups]
      properties:
        antecedentGroups:
          type: array
          description: A（行为前因）分组，共 5 组。
          items:
            $ref: '#/components/schemas/AbcTagGroup'
        consequenceGroups:
          type: array
          description: C（行为后果）分组，共 6 组。
          items:
            $ref: '#/components/schemas/AbcTagGroup'

    CreateClassRecordRequest:
      type: object
      required:
        - recordDate
        - courseCode
        - environmentCode
        - observationDurationMinutes
      properties:
        recordDate:
          type: string
          format: date
        courseCode:
          $ref: '#/components/schemas/CourseCodeValue'
        courseOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        environmentCode:
          $ref: '#/components/schemas/EnvironmentCodeValue'
        environmentOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        observationDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        overallRemark:
          type: string
          nullable: true
          maxLength: 1000

    UpdateClassRecordRequest:
      type: object
      minProperties: 1
      properties:
        recordDate:
          type: string
          format: date
        courseCode:
          $ref: '#/components/schemas/CourseCodeValue'
        courseOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        environmentCode:
          $ref: '#/components/schemas/EnvironmentCodeValue'
        environmentOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        observationDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        overallRemark:
          type: string
          nullable: true
          maxLength: 1000

    ClassRecordSummary:
      type: object
      required:
        - id
        - recordDate
        - courseCode
        - courseLabel
        - environmentCode
        - environmentLabel
        - observationDurationMinutes
      properties:
        id:
          type: integer
          format: int64
        recordDate:
          type: string
          format: date
        courseCode:
          $ref: '#/components/schemas/CourseCodeValue'
        courseLabel:
          type: string
        courseOtherDescription:
          type: string
          nullable: true
        environmentCode:
          $ref: '#/components/schemas/EnvironmentCodeValue'
        environmentLabel:
          type: string
        environmentOtherDescription:
          type: string
          nullable: true
        observationDurationMinutes:
          type: integer
        overallRemark:
          type: string
          nullable: true

    BehaviorCardSummary:
      type: object
      required: [behaviorCode, behaviorLabel, count]
      properties:
        behaviorCode:
          type: string
        behaviorLabel:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
        latestRecordId:
          type: integer
          format: int64
          nullable: true
        latestDetailSaved:
          type: boolean
          nullable: true

    ClassRecordDetail:
      allOf:
        - $ref: '#/components/schemas/ClassRecordSummary'
        - type: object
          required: [behaviorCards]
          properties:
            behaviorCards:
              type: array
              items:
                $ref: '#/components/schemas/BehaviorCardSummary'

    CreateQuickBehaviorRequest:
      type: object
      required: [behaviorCode]
      properties:
        behaviorCode:
          type: string
          minLength: 1
          maxLength: 64

    CreateSupplementBehaviorRequest:
      type: object
      required: [behaviorCode, occurredAt]
      properties:
        behaviorCode:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
          description: 必须是过去或当前时间，后端统一转换为上海时区

    BehaviorRecordListItem:
      type: object
      required: [id, occurredAt, detailSaved]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        detailSaved:
          type: boolean

    BehaviorCardMutationResult:
      type: object
      required: [record, card]
      properties:
        record:
