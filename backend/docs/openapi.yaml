    TrainingGoalCategoryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingGoalCategory'

    TrainingGoalLibraryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingGoalLibraryItem'

    TrainingPlanItemListApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TrainingPlanItem'

    TrainingPlanItemApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrainingPlanItem'

    EmptyApiResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]

    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [40001, 40002, 40101, 40401, 40901, 40902, 50000]
        message:
          type: string
          minLength: 1
        data:
          type: object
          nullable: true
          example: null

    UserRole:
      type: string
      enum: [RESOURCE_TEACHER, SHADOW_TEACHER, PARENT]

    UserProfile:
      type: object
      required: [id, teacherId, name, role]
      properties:
        id:
          type: integer
          format: int64
        teacherId:
          type: string
          enum: [t001, t002, t003]
        avatar:
          type: string
          nullable: true
          maxLength: 500
        name:
          type: string
        school:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'

    StudentSummary:
      type: object
      required: [id, studentCode, name]
      properties:
        id:
          type: integer
          format: int64
        studentCode:
          type: string
          pattern: '^s[0-9]{3}$'
        name:
          type: string
        gender:
          type: string
          nullable: true
          enum: [MALE, FEMALE]
        age:
          type: integer
          nullable: true
          minimum: 0
        className:
          type: string
          nullable: true
        disabilityType:
          type: string
          nullable: true
        remark:
          type: string
          nullable: true

    MyProfile:
      type: object
      required: [user, requiresStudentSelection]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        currentStudent:
          type: object
          allOf:
            - $ref: '#/components/schemas/StudentSummary'
          nullable: true
        requiresStudentSelection:
          type: boolean

    UpdateCurrentStudentRequest:
      type: object
      required: [studentId]
      properties:
        studentId:
          type: integer
          format: int64
          minimum: 1

    CodeLabel:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string

    CreateClassRecordRequest:
      type: object
      required:
        - recordDate
        - courseCode
        - environmentCode
        - observationDurationMinutes
      properties:
        recordDate:
          type: string
          format: date
        courseCode:
          type: string
          minLength: 1
          maxLength: 64
        courseOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        environmentCode:
          type: string
          minLength: 1
          maxLength: 64
        environmentOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        observationDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        overallRemark:
          type: string
          nullable: true
          maxLength: 1000

    UpdateClassRecordRequest:
      type: object
      minProperties: 1
      properties:
        recordDate:
          type: string
          format: date
        courseCode:
          type: string
          minLength: 1
          maxLength: 64
        courseOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        environmentCode:
          type: string
          minLength: 1
          maxLength: 64
        environmentOtherDescription:
          type: string
          nullable: true
          maxLength: 255
        observationDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        overallRemark:
          type: string
          nullable: true
          maxLength: 1000

    ClassRecordSummary:
      type: object
      required:
        - id
        - recordDate
        - courseCode
        - courseLabel
        - environmentCode
        - environmentLabel
        - observationDurationMinutes
      properties:
        id:
          type: integer
          format: int64
        recordDate:
          type: string
          format: date
        courseCode:
          type: string
        courseLabel:
          type: string
        courseOtherDescription:
          type: string
          nullable: true
        environmentCode:
          type: string
        environmentLabel:
          type: string
        environmentOtherDescription:
          type: string
          nullable: true
        observationDurationMinutes:
          type: integer
        overallRemark:
          type: string
          nullable: true

    BehaviorCardSummary:
      type: object
      required: [behaviorCode, behaviorLabel, count]
      properties:
        behaviorCode:
          type: string
        behaviorLabel:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
        latestRecordId:
          type: integer
          format: int64
          nullable: true
        latestDetailSaved:
          type: boolean
          nullable: true

    ClassRecordDetail:
      allOf:
        - $ref: '#/components/schemas/ClassRecordSummary'
        - type: object
          required: [behaviorCards]
          properties:
            behaviorCards:
              type: array
              items:
                $ref: '#/components/schemas/BehaviorCardSummary'

    CreateQuickBehaviorRequest:
      type: object
      required: [behaviorCode]
      properties:
        behaviorCode:
          type: string
          minLength: 1
          maxLength: 64

    CreateSupplementBehaviorRequest:
      type: object
      required: [behaviorCode, occurredAt]
      properties:
        behaviorCode:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
          description: 必须是过去或当前时间，后端统一转换为上海时区

    BehaviorRecordListItem:
      type: object
      required: [id, occurredAt, detailSaved]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        detailSaved:
          type: boolean

    BehaviorCardMutationResult:
      type: object
      required: [record, card]
      properties:
        record:
          $ref: '#/components/schemas/BehaviorRecordListItem'
        card:
          $ref: '#/components/schemas/BehaviorCardSummary'

    AssistanceInput:
      type: object
      required: [code, content]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 500

    AssistanceDetail:
      allOf:
        - $ref: '#/components/schemas/AssistanceInput'
        - type: object
          required: [label, group]
          properties:
            label:
              type: string
            group:
              type: string
              enum: [INTERNAL_STIMULUS, EXTERNAL_STIMULUS]

    SaveBehaviorDetailsRequest:
      type: object
      required: [assistances]
      properties:
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
        stageCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        antecedentText:
          type: string
          nullable: true
          maxLength: 1000
        behaviorDescription:
          type: string
          nullable: true
          maxLength: 1000
        consequenceText:
          type: string
          nullable: true
          maxLength: 1000
        functionCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        assistances:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AssistanceInput'
        assistanceResultText:
          type: string
          nullable: true
          maxLength: 1000

    BehaviorRecordDetail:
      type: object
      required:
        - id
        - classRecordId
        - behaviorCode
        - behaviorLabel
        - occurredAt
        - detailSaved
        - assistances
      properties:
        id:
          type: integer
          format: int64
        classRecordId:
          type: integer
          format: int64
        behaviorCode:
          type: string
        behaviorLabel:
          type: string
        occurredAt:
          type: string
          format: date-time
        detailSaved:
          type: boolean
        durationMinutes:
          type: integer
          nullable: true
        stageCode:
          type: string
          nullable: true
        stageLabel:
          type: string
          nullable: true
        antecedentText:
          type: string
          nullable: true
        behaviorDescription:
          type: string
          nullable: true
        consequenceText:
          type: string
          nullable: true
        functionCode:
          type: string
          nullable: true
        functionLabel:
          type: string
          nullable: true
        assistances:
          type: array
          items:
            $ref: '#/components/schemas/AssistanceDetail'
        assistanceResultText:
          type: string
          nullable: true

    BehaviorCountItem:
      type: object
      required: [behaviorCode, behaviorLabel, count]
      properties:
        behaviorCode:
          type: string
        behaviorLabel:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0

    BehaviorCountStatistics:
      type: object
      required: [studentId, periodStart, periodEnd, totalCount, items]
      properties:
        studentId:
          type: integer
          format: int64
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        totalCount:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/BehaviorCountItem'

    EvaluationOverview:
      type: object
      required: [observationCourseCount, behaviorRecordCount, abcRecordCount, remarkCount]
      properties:
        observationCourseCount:
          type: integer
          format: int64
          minimum: 0
          description: 当前周期创建的课堂记录数量
        behaviorRecordCount:
          type: integer
          format: int64
          minimum: 0
          description: 当前周期行为记录总数
        abcRecordCount:
          type: integer
          format: int64
          minimum: 0
          description: 当前周期 detailSaved 为 true 的行为记录数
        remarkCount:
          type: integer
          format: int64
          minimum: 0
          description: 当前周期填写了本周期行为备注的课堂记录数

    BehaviorTrendItem:
      type: object
      required: [behaviorCode, behaviorLabel, count, previousCount, trendDirection]
      properties:
        behaviorCode:
          type: string
        behaviorLabel:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
          description: 当前周期次数
        previousCount:
          type: integer
          format: int64
          minimum: 0
          description: 上一周期次数
        changePercent:
          type: integer
          nullable: true
          minimum: 0
          description: 变化幅度的绝对百分比；上期为 0 且本期大于 0 时返回 null
        trendDirection:
          $ref: '#/components/schemas/TrendDirection'

    StudentEvaluationStatistics:
      type: object
      required:
        - studentId
        - period
        - periodStart
        - periodEnd
        - comparisonStart
        - comparisonEnd
        - overview
        - totalCount
        - items
      properties:
        studentId:
          type: integer
          format: int64
        period:
          $ref: '#/components/schemas/EvaluationPeriod'
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        comparisonStart:
          type: string
          format: date
          description: 上一统计周期开始日期
        comparisonEnd:
          type: string
          format: date
          description: 上一统计周期结束日期
        overview:
          $ref: '#/components/schemas/EvaluationOverview'
        totalCount:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          description: 当前周期或上一周期至少出现过一次的行为
          items:
            $ref: '#/components/schemas/BehaviorTrendItem'

    ClassRecordSummaryPeriod:
      type: string
      enum: [WEEKLY, MONTHLY]

    EvaluationPeriod:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]

    TrendDirection:
      type: string
      enum: [UP, DOWN, STABLE]
      description: UP 前端显示红色，DOWN 显示绿色，STABLE 显示灰色

    TrainingStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, PAUSED]

    TrainingGoalCategory:
      type: object
      required: [code, label, displayOrder, custom]
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer
          minimum: 0
        custom:
          type: boolean

    TrainingGoalLibraryItem:
      type: object
      required: [id, standardNumber, categoryCode, categoryLabel, goalText, assigned]
      properties:
        id:
          type: integer
          format: int64
        standardNumber:
          type: integer
          minimum: 1
          maximum: 165
          description: 标准目标业务编号
        categoryCode:
          type: string
        categoryLabel:
          type: string
        goalText:
          type: string
        assigned:
          type: boolean

    StandardGoalAssignmentInput:
      type: object
      required: [goalId, initialLevel]
      properties:
        goalId:
          type: integer
          format: int64
          minimum: 1
        initialLevel:
          type: string
          minLength: 1
          maxLength: 32
          description: 具体等级全集待提供

    AssignStandardGoalsRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StandardGoalAssignmentInput'

    CreateCustomGoalRequest:
      type: object
      required: [goalText, initialLevel]
      properties:
        goalText:
          type: string
          minLength: 1
          maxLength: 500
        initialLevel:
          type: string
          minLength: 1
          maxLength: 32

    UpdateTrainingPlanItemRequest:
      type: object
      minProperties: 1
      properties:
        currentLevel:
          type: string
          minLength: 1
          maxLength: 32
        phase:
          type: integer
          enum: [1, 2, 3]
        status:
          $ref: '#/components/schemas/TrainingStatus'

    TrainingPlanItem:
      type: object
      required:
        - id
        - goalId
        - standardNumber
        - goalType
        - categoryCode
        - categoryLabel
        - goalText
        - initialLevel
        - currentLevel
        - phase
        - status
        - hasProgress
      properties:
        id:
          type: integer
          format: int64
        goalId:
          type: integer
          format: int64
        standardNumber:
          type: integer
          nullable: true
          minimum: 1
          maximum: 165
          description: 标准目标业务编号；自定义目标为 null
        goalType:
          type: string
          enum: [STANDARD, CUSTOM]
        categoryCode:
          type: string
        categoryLabel:
          type: string
        goalText:
          type: string
        initialLevel:
          type: string
        currentLevel:
          type: string
        phase:
          type: integer
          enum: [1, 2, 3]
        status:
          $ref: '#/components/schemas/TrainingStatus'
        hasProgress:
          type: boolean

  responses:
    UnauthorizedTeacher:
      description: 缺少或无法识别白名单教师身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40101
            message: 未识别的教师身份
            data: null
    ValidationError:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40001
            message: 请求参数不合法
            data: null
    BusinessValidationError:
      description: 请求参数不合法，或当前用户尚未选择学生
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                code: 40001
                message: 请求参数不合法
                data: null
            currentStudentRequired:
              value:
                code: 40002
                message: 请先选择当前学生
                data: null
    ResourceNotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40401
            message: 资源不存在
            data: null
    ResourceConflict:
      description: 资源状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40901
            message: 该训练目标已经分配给当前学生
            data: null
    ProgressConfirmationRequired:
      description: 已产生进度，删除前需要二次确认
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40902
            message: 该目标已经产生进度，请确认后再删除
            data: null
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50000
            message: 服务内部错误
            data: null
